# Forgenta 웹 정적 서빙 + /api 게이트웨이 프록시 (SSE 위해 버퍼링 off, SPA fallback)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-gateway.forgenta-core.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
