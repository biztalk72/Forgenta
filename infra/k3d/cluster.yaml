# Forgenta k3d 클러스터 정의 (DGX Spark 프로필 — GPU passthrough, ARM64)
# v3.4: server 1 + agent 2, loadbalancer 8080/8443, hostPath /var/lib/forgenta/models 마운트.
# GPU passthrough는 CLI 플래그(`k3d cluster create --gpus all`)로 부여 — bootstrap.sh 참조.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: forgenta
image: docker.io/rancher/k3s:v1.30.4-k3s1
servers: 1
agents: 2
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
volumes:
  # 모델 가중치 영속 캐시 — vLLM/Ollama Pod가 hostPath PV로 마운트해 사용 (v3.4 §5.5)
  - volume: /var/lib/forgenta/models:/var/lib/forgenta/models
    nodeFilters:
      - agent:*
      - server:*
  # NVIDIA Container Runtime — k3s containerd가 부팅 시 자동 감지하기 위해 호스트 바이너리 mount
  - volume: /usr/bin/nvidia-container-runtime:/usr/bin/nvidia-container-runtime:ro
    nodeFilters: [agent:*, server:*]
  - volume: /usr/bin/nvidia-container-runtime-hook:/usr/bin/nvidia-container-runtime-hook:ro
    nodeFilters: [agent:*, server:*]
  - volume: /usr/bin/nvidia-container-cli:/usr/bin/nvidia-container-cli:ro
    nodeFilters: [agent:*, server:*]
  - volume: /usr/bin/nvidia-ctk:/usr/bin/nvidia-ctk:ro
    nodeFilters: [agent:*, server:*]
  - volume: /usr/lib/aarch64-linux-gnu/libnvidia-container.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-container.so.1:ro
    nodeFilters: [agent:*, server:*]
  - volume: /usr/lib/aarch64-linux-gnu/libnvidia-container-go.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-container-go.so.1:ro
    nodeFilters: [agent:*, server:*]
  - volume: /etc/nvidia-container-runtime/config.toml:/etc/nvidia-container-runtime/config.toml:ro
    nodeFilters: [agent:*, server:*]
options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
