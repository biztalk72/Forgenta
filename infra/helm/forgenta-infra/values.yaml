# forgenta-infra 차트 기본값 - 로컬 k3d 데이터 계층 (단일 레플리카, local-path PVC)
postgresql:
  enabled: true
  image: timescale/timescaledb-ha:pg16   # TimescaleDB + pgvector 번들
  port: 5432
  user: forgenta
  password: forgenta
  database: forgenta
  storage: 2Gi

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379

qdrant:
  enabled: true
  image: qdrant/qdrant:latest
  httpPort: 6333
  grpcPort: 6334
  storage: 2Gi

minio:
  enabled: true
  image: minio/minio:latest
  apiPort: 9000
  consolePort: 9001
  accessKey: forgenta
  secretKey: forgenta-secret
  storage: 5Gi
