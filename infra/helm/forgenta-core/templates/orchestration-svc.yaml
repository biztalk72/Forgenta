{{- if .Values.orchestration.enabled }}
# Orchestration-Svc 배포 + 서비스 (LangGraph + Ollama 스트리밍)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestration-svc
  template:
    metadata:
      labels:
        app: orchestration-svc
    spec:
      containers:
        - name: orchestration-svc
          image: {{ .Values.orchestration.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.orchestration.port }}
          env:
            - name: ORCHESTRATION_SVC_PORT
              value: {{ .Values.orchestration.port | quote }}
            - name: OLLAMA_HOST
              value: {{ .Values.ollamaHost | quote }}
            {{- if .Values.inferenceGatewayURL }}
            - name: INFERENCE_GATEWAY_URL
              value: {{ .Values.inferenceGatewayURL | quote }}
            {{- end }}
            {{- if .Values.orchestration.plannerModel }}
            - name: DEFAULT_PLANNER_MODEL
              value: {{ .Values.orchestration.plannerModel | quote }}
            {{- end }}
            - name: DEFAULT_EXECUTOR_MODEL
              value: {{ .Values.orchestration.executorModel | quote }}
            - name: DEFAULT_ROUTER_MODEL
              value: {{ .Values.orchestration.routerModel | quote }}
            {{- if .Values.orchestration.summarizerModel }}
            - name: DEFAULT_SUMMARIZER_MODEL
              value: {{ .Values.orchestration.summarizerModel | quote }}
            {{- end }}
            {{- if .Values.orchestration.embedModel }}
            - name: DEFAULT_EMBED_MODEL
              value: {{ .Values.orchestration.embedModel | quote }}
            {{- end }}
            {{- if .Values.orchestration.criticModel }}
            - name: DEFAULT_CRITIC_MODEL
              value: {{ .Values.orchestration.criticModel | quote }}
            {{- end }}
            - name: HEADROOM_PROXY_URL
              value: "http://headroom-proxy:{{ .Values.headroomProxy.port }}"
            - name: HEADROOM_ENABLED
              value: "true"
            - name: GOVERNANCE_URL
              value: "http://governance-svc:{{ .Values.governance.port }}"
            - name: WORKFLOW_URL
              value: "http://workflow-svc:{{ .Values.workflow.port }}"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.orchestration.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-svc
spec:
  selector:
    app: orchestration-svc
  ports:
    - port: {{ .Values.orchestration.port }}
      targetPort: {{ .Values.orchestration.port }}
{{- end }}
