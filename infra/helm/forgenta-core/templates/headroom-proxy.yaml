{{- if .Values.headroomProxy.enabled }}
# Headroom-Proxy 배포 + 서비스 (컨텍스트 압축)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headroom-proxy
  template:
    metadata:
      labels:
        app: headroom-proxy
    spec:
      containers:
        - name: headroom-proxy
          image: {{ .Values.headroomProxy.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.headroomProxy.port }}
          env:
            - name: HEADROOM_PROXY_PORT
              value: {{ .Values.headroomProxy.port | quote }}
            - name: HEADROOM_MODE
              value: {{ .Values.headroomProxy.mode | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.headroomProxy.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: headroom-proxy
spec:
  selector:
    app: headroom-proxy
  ports:
    - port: {{ .Values.headroomProxy.port }}
      targetPort: {{ .Values.headroomProxy.port }}
{{- end }}
