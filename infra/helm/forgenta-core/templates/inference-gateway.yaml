{{- if .Values.inferenceGateway.enabled }}
# inference-gateway (PRD v3.4 §2.3 [8]) — 모델→백엔드 라우팅, 내부 전용.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-gateway-routes
data:
  routes.yaml: |
{{ .Values.inferenceGateway.routes | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: inference-gateway
          image: {{ .Values.inferenceGateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.inferenceGateway.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.inferenceGateway.port | quote }}
            - name: ROUTES_PATH
              value: /etc/inference-gateway/routes.yaml
          volumeMounts:
            - name: routes
              mountPath: /etc/inference-gateway
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: routes
          configMap:
            name: inference-gateway-routes
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
spec:
  type: ClusterIP                        # 외부 노출 금지
  selector:
    app: inference-gateway
  ports:
    - port: {{ .Values.inferenceGateway.port }}
      targetPort: http
      name: http
{{- end }}
