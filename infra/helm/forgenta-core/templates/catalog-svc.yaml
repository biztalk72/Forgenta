{{- if .Values.catalog.enabled }}
# Catalog-Svc 배포 + 서비스 (Agent/App/PromptTemplate 카탈로그)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-svc
  template:
    metadata:
      labels:
        app: catalog-svc
    spec:
      containers:
        - name: catalog-svc
          image: {{ .Values.catalog.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.catalog.port }}
          env:
            - name: CATALOG_SVC_PORT
              value: {{ .Values.catalog.port | quote }}
            - name: DATABASE_URL
              value: {{ .Values.databaseURL | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.catalog.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-svc
spec:
  selector:
    app: catalog-svc
  ports:
    - port: {{ .Values.catalog.port }}
      targetPort: {{ .Values.catalog.port }}
{{- end }}
