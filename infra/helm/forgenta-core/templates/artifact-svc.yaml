{{- if .Values.artifact.enabled }}
# Artifact-Svc 배포 + 서비스 (멀티모달 OutputArtifact, MinIO)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifact-svc
  template:
    metadata:
      labels:
        app: artifact-svc
    spec:
      containers:
        - name: artifact-svc
          image: {{ .Values.artifact.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.artifact.port }}
          env:
            - name: ARTIFACT_SVC_PORT
              value: {{ .Values.artifact.port | quote }}
            - name: DATABASE_URL
              value: {{ .Values.databaseURL | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.artifact.minioEndpoint | quote }}
            - name: MINIO_ACCESS_KEY
              value: {{ .Values.artifact.minioAccessKey | quote }}
            - name: MINIO_SECRET_KEY
              value: {{ .Values.artifact.minioSecretKey | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.artifact.bucket | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.artifact.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-svc
spec:
  selector:
    app: artifact-svc
  ports:
    - port: {{ .Values.artifact.port }}
      targetPort: {{ .Values.artifact.port }}
{{- end }}
