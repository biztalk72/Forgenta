{{- if .Values.workflow.enabled }}
# Workflow-Svc 배포 + 서비스 (v3 워크플로우 카탈로그/런 기록)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-svc
  template:
    metadata:
      labels:
        app: workflow-svc
    spec:
      containers:
        - name: workflow-svc
          image: {{ .Values.workflow.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.workflow.port }}
          env:
            - name: WORKFLOW_SVC_PORT
              value: {{ .Values.workflow.port | quote }}
            - name: DATABASE_URL
              value: {{ .Values.databaseURL | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.workflow.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-svc
spec:
  selector:
    app: workflow-svc
  ports:
    - port: {{ .Values.workflow.port }}
      targetPort: {{ .Values.workflow.port }}
{{- end }}
