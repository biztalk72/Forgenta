{{- if .Values.apiGateway.enabled }}
# API Gateway 배포 + 서비스 (단일 진입점, in-namespace 서비스로 라우팅)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.apiGateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: API_GATEWAY_PORT
              value: {{ .Values.apiGateway.port | quote }}
            - name: JWT_SECRET
              value: {{ .Values.jwtSecret | quote }}
            - name: IDENTITY_URL
              value: "http://identity-svc:{{ .Values.identity.port }}"
            - name: ORCHESTRATION_URL
              value: "http://orchestration-svc:{{ .Values.orchestration.port }}"
            - name: CATALOG_URL
              value: "http://catalog-svc:{{ .Values.catalog.port }}"
            - name: ARTIFACT_URL
              value: "http://artifact-svc:{{ .Values.artifact.port }}"
            - name: GOVERNANCE_URL
              value: "http://governance-svc:{{ .Values.governance.port }}"
            - name: WORKFLOW_URL
              value: "http://workflow-svc:{{ .Values.workflow.port }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
{{- end }}
