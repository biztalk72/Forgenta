{{- if .Values.governance.enabled }}
# Governance-Svc 배포 + 서비스 (승인/감사/계량)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governance-svc
  template:
    metadata:
      labels:
        app: governance-svc
    spec:
      containers:
        - name: governance-svc
          image: {{ .Values.governance.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.governance.port }}
          env:
            - name: GOVERNANCE_SVC_PORT
              value: {{ .Values.governance.port | quote }}
            - name: DATABASE_URL
              value: {{ .Values.databaseURL | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.governance.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: governance-svc
spec:
  selector:
    app: governance-svc
  ports:
    - port: {{ .Values.governance.port }}
      targetPort: {{ .Values.governance.port }}
{{- end }}
