{{- if .Values.identity.enabled }}
# Identity-Svc 배포 + 서비스 (JWT/RBAC/워크스페이스)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-svc
  template:
    metadata:
      labels:
        app: identity-svc
    spec:
      containers:
        - name: identity-svc
          image: {{ .Values.identity.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.identity.port }}
          env:
            - name: IDENTITY_SVC_PORT
              value: {{ .Values.identity.port | quote }}
            - name: DATABASE_URL
              value: {{ .Values.databaseURL | quote }}
            - name: JWT_SECRET
              value: {{ .Values.jwtSecret | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.identity.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identity-svc
spec:
  selector:
    app: identity-svc
  ports:
    - port: {{ .Values.identity.port }}
      targetPort: {{ .Values.identity.port }}
{{- end }}
