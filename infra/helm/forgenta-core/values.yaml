# forgenta-core 차트 기본값 - 핵심 서비스 (로컬 k3d, 이미지는 k3d image import로 적재)
jwtSecret: dev-secret-key-minimum-32-characters-long
databaseURL: postgres://forgenta:forgenta@postgresql.forgenta-infra.svc.cluster.local:5432/forgenta?sslmode=disable
ollamaHost: http://host.k3d.internal:11434

identity:
  enabled: true
  image: forgenta/identity-svc:latest
  port: 8001

orchestration:
  enabled: true
  image: forgenta/orchestration-svc:latest
  port: 8002
  executorModel: ollama/qwen3:8b
  routerModel: ollama/qwen3:1.7b

apiGateway:
  enabled: true
  image: forgenta/api-gateway:latest
  port: 8000

headroomProxy:
  enabled: true
  image: forgenta/headroom-proxy:latest
  port: 8787
  mode: safe

catalog:
  enabled: true
  image: forgenta/catalog-svc:latest
  port: 8003

artifact:
  enabled: true
  image: forgenta/artifact-svc:latest
  port: 8004
  minioEndpoint: minio.forgenta-infra.svc.cluster.local:9000
  minioAccessKey: forgenta
  minioSecretKey: forgenta-secret
  bucket: artifacts

# 후속 서비스는 해당 Phase에서 활성화
governance:
  enabled: false
