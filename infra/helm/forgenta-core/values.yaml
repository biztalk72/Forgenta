# forgenta-core 차트 기본값 - 핵심 서비스 (로컬 k3d, 이미지는 k3d image import로 적재)
jwtSecret: dev-secret-key-minimum-32-characters-long
databaseURL: postgres://forgenta:forgenta@postgresql.forgenta-infra.svc.cluster.local:5432/forgenta?sslmode=disable
ollamaHost: http://host.k3d.internal:11434

identity:
  enabled: true
  image: forgenta/identity-svc:latest
  port: 8001

orchestration:
  enabled: true
  image: forgenta/orchestration-svc:latest
  port: 8002
  executorModel: ollama/qwen3:8b
  routerModel: ollama/qwen3:1.7b

apiGateway:
  enabled: true
  image: forgenta/api-gateway:latest
  port: 8000

headroomProxy:
  enabled: true
  image: forgenta/headroom-proxy:latest
  port: 8787
  mode: safe

catalog:
  enabled: true
  image: forgenta/catalog-svc:latest
  port: 8003

artifact:
  enabled: true
  image: forgenta/artifact-svc:latest
  port: 8004
  minioEndpoint: minio.forgenta-infra.svc.cluster.local:9000
  minioAccessKey: forgenta
  minioSecretKey: forgenta-secret
  bucket: artifacts

governance:
  enabled: true
  image: forgenta/governance-svc:latest
  port: 8005

# v3.4 — inference-gateway (모델→백엔드 라우팅, 내부 전용).
# 기본 비활성. DGX 프로필(values-dgx.yaml)에서 enable.
inferenceGateway:
  enabled: false
  image: forgenta/inference-gateway:latest
  port: 8800
  # 라우팅 테이블 YAML — ConfigMap에 그대로 저장 후 /etc/inference-gateway/routes.yaml 로 마운트
  routes: |
    routes:
      - match: "qwen3-72b-*"
        backend: "vllm-planner"
        fallback: ["vllm-summarizer", "ollama"]
      - match: "qwen3-coder-32b*"
        backend: "vllm-executor"
        fallback: ["ollama"]
      - match: "qwen3-1.7b*"
        backend: "vllm-router"
        fallback: ["ollama"]
      - match: "qwen3-8b*"
        backend: "vllm-summarizer"
        fallback: ["ollama"]
      - match: "bge-*"
        backend: "vllm-embed"
      - match: "ollama/*"
        backend: "ollama"
      - match: "claude-*"
        backend: "external"
      - match: "gpt-*"
        backend: "external"
      - match: "gemini-*"
        backend: "external"
    backends:
      vllm-planner:    "http://vllm-planner.forgenta-llm:8000"
      vllm-executor:   "http://vllm-executor.forgenta-llm:8000"
      vllm-router:     "http://vllm-router.forgenta-llm:8000"
      vllm-summarizer: "http://vllm-summarizer.forgenta-llm:8000"
      vllm-embed:      "http://vllm-embed.forgenta-llm:8000"
      ollama:          "http://ollama.forgenta-llm:11434"
