{{- if .Values.prometheus.enabled }}
# Prometheus — vLLM / inference-gateway / DCGM 메트릭 수집 (PRD v3.4 §14)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: 15s
    scrape_configs:
      # DCGM exporter (GPU 메트릭)
      - job_name: dcgm-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [forgenta-obs]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: dcgm-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: ${1}:{{ .Values.dcgmExporter.port }}
            target_label: __address__

      # vLLM 백엔드 (forgenta-llm 네임스페이스 모든 vllm-* 파드의 :8000/metrics)
      - job_name: vllm
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [forgenta-llm]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: vllm-.*
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: backend
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: ${1}:8000
            target_label: __address__
        metrics_path: /metrics

      # inference-gateway (forgenta-core)
      - job_name: inference-gateway
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [forgenta-core]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: inference-gateway
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: ${1}:8800
            target_label: __address__
        metrics_path: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time={{ .Values.prometheus.retention }}"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
{{- end }}
