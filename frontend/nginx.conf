server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend — host is configurable via API_HOST env var
    # Docker Compose: API_HOST=api (service name DNS)
    # ECS Fargate:    API_HOST=localhost (containers share network namespace)
    location /api/ {
        proxy_pass http://${API_HOST}:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Required for streaming responses
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # React Router — fall back to index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
